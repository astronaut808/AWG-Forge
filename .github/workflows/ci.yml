name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Download modules
        run: go mod download

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck UI
        run: npm run ui:check

      - name: Build UI
        run: npm run ui:build

      - name: Verify API contract
        run: make api-contract

      - name: Check generated UI
        run: git diff --exit-code -- internal/server/static

      - name: Test
        run: go test ./...

      - name: Test shell scripts
        run: make test-shell

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Lint Go
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2

      - name: Lint UI
        run: npm run ui:lint

      - name: Aislop quality gate
        run: npm run quality:aislop
