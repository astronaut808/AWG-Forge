name: CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.8

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          package-manager-cache: false
          cache: npm

      - name: Set up npm
        env:
          NPM_VERSION: "12.2.1"
          NPM_SHA512: "6ca0a6151553fc107e60f1186d9c10d57508dcde6de31292a54d4cc4e8e8ef3de25b3281274657442d7115d10df930bb3794ddcb0681cdfd9d317189abf7b63d"
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          curl -fsSL "https://registry.npmjs.org/npm/-/npm-${NPM_VERSION}.tgz" -o "$work/npm.tgz"
          echo "$NPM_SHA512  $work/npm.tgz" | sha512sum -c -
          prefix=$(mktemp -d "$RUNNER_TEMP/awg-npm.XXXXXX")
          tar -xzf "$work/npm.tgz" --strip-components=1 -C "$prefix"
          ln -sf npm-cli.js "$prefix/bin/npm"
          ln -sf npx-cli.js "$prefix/bin/npx"
          echo "$prefix/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Download modules
        run: go mod download

      - name: Install frontend dependencies
        run: npm ci

      - name: Use locked project tools
        run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Typecheck UI
        run: npm run ui:check

      - name: Build UI
        run: npm run ui:build

      - name: Verify API contract
        run: make api-contract

      - name: Check generated UI
        run: git diff --exit-code -- internal/server/static

      - name: Install test browser
        run: npx --no-install playwright install --with-deps chromium

      - name: Browser regression tests
        run: npx --no-install playwright test

      - name: Test
        run: go test ./...

      - name: Test shell scripts
        run: make test-shell

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Lint Go
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

      - name: Lint UI
        run: npm run ui:lint

      - name: Aislop quality gate
        run: npm run quality:aislop
